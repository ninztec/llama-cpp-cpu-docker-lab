services:
  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server

    container_name: llama-cpu-server

    restart: unless-stopped

    ports:
      - "127.0.0.1:8086:8080"

    volumes:
      - ./models:/models:ro

    command:
      - "-m"
      - "/models/TinyLlama-1.1B-Chat-v1.0-Q4_K_M.gguf"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "-c"
      - "2048"
      - "-t"
      - "4"